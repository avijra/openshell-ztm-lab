<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenShell on Zero Trust — Demo Lab</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:wght@400;500;700&family=Red+Hat+Mono:wght@400;500&display=swap">
  <style>
    :root {
      --theme-color: #CC0000;
      --base-font-size: 15px;
      --base-font-family: "Red Hat Text", "Overpass", "Open Sans", Helvetica, Arial, sans-serif;
      --content-max-width: 70em;
      --sidebar-width: 18rem;
    }
    body { font-family: var(--base-font-family); color: #151515; }

    /* ─── Sidebar — Red Hat light palette ─── */
    .sidebar {
      background: #f5f5f5;
      border-right: 1px solid #d2d2d2;
    }
    .sidebar > h1 {
      font-weight: 700; color: #CC0000; font-size: 1.1rem;
      padding: 20px 20px 0 20px;
    }
    .sidebar ul li a { color: #151515 !important; font-size: 14px; }
    .sidebar ul li a:hover { color: #CC0000 !important; }
    .sidebar ul li.active > a { color: #CC0000 !important; font-weight: 700; border-right: 3px solid #CC0000; }
    .app-name-link { color: #CC0000 !important; font-weight: 700; }

    /* ─── Content area ─── */
    .markdown-section { max-width: var(--content-max-width); }
    .markdown-section h1 { color: #151515; font-weight: 700; border-bottom: 2px solid #CC0000; padding-bottom: 8px; }
    .markdown-section h2 { color: #151515; font-weight: 700; margin-top: 2em; }
    .markdown-section h3 { color: #4d4d4d; }
    .markdown-section a { color: #0066CC; }
    .markdown-section a:hover { color: #004080; }
    .markdown-section strong { color: #151515; }

    /* ─── Code blocks ─── */
    .markdown-section pre {
      background: #292e33; border-radius: 6px; border: 1px solid #3c3f42;
    }
    .markdown-section pre > code {
      font-family: "Red Hat Mono", "Liberation Mono", monospace;
      font-size: 13px; color: #e0e0e0; white-space: pre-wrap !important;
      overflow-wrap: break-word !important;
    }
    .markdown-section code {
      font-family: "Red Hat Mono", "Liberation Mono", monospace;
      background: #f0f0f0; color: #CC0000; padding: 2px 6px; border-radius: 3px; font-size: 0.9em;
    }
    .markdown-section pre > code { background: transparent; color: #e0e0e0; padding: 0; }

    /* ─── Tables — Red Hat style ─── */
    .markdown-section table {
      border-collapse: collapse; width: 100%;
      font-size: 14px; margin: 1em 0;
    }
    .markdown-section table th {
      background: #CC0000; color: #fff; font-weight: 600;
      padding: 10px 14px; text-align: left; border: 1px solid #a30000;
    }
    .markdown-section table td {
      padding: 10px 14px; border: 1px solid #d2d2d2;
    }
    .markdown-section table tr:nth-child(even) { background: #fafafa; }
    .markdown-section table tr:hover { background: #fff5f5; }

    /* ─── Blockquotes as Red Hat alert boxes ─── */
    .markdown-section blockquote {
      background: #fdf7e3; border-left: 4px solid #f0ab00;
      padding: 12px 16px; margin: 1.5em 0; color: #3c3f42; border-radius: 0 4px 4px 0;
    }
    .markdown-section blockquote p { margin: 0; }

    /* ─── Mermaid diagrams — overflow fix + edge label fix ─── */
    .mermaid {
      overflow-x: auto; overflow-y: hidden;
      max-width: 100%; padding: 16px 0; text-align: center;
    }
    .mermaid svg { max-width: 100%; height: auto; }
    .mermaid .edgeLabel { color: #333 !important; }
    .mermaid .edgeLabel span { color: #333 !important; }

    /* ─── Images ─── */
    .markdown-section img {
      border: 1px solid #d2d2d2; border-radius: 4px; padding: 4px; max-width: 100%;
    }

    /* ─── Config bar — sticky top ─── */
    .lab-config {
      position: sticky; top: 0; z-index: 100;
      background: #151515; color: #e0e0e0;
      padding: 10px 16px; font-size: 13px;
      display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap;
      font-family: var(--base-font-family);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .lab-config .field { flex: 1; min-width: 130px; }
    .lab-config label {
      display: block; font-size: 12px; text-transform: uppercase;
      letter-spacing: 0.5px; color: #a3a3a3; margin-bottom: 3px;
    }
    .lab-config input {
      width: 100%; padding: 6px 8px;
      background: #292e33; color: #e0e0e0; border: 1px solid #4d4d4d;
      border-radius: 3px; font-family: "Red Hat Mono", monospace; font-size: 13px;
      box-sizing: border-box;
    }
    .lab-config input:focus { outline: none; border-color: #CC0000; }
    .lab-config button {
      padding: 7px 16px; border: none; border-radius: 3px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .lab-config .btn-save { background: #CC0000; color: #fff; }
    .lab-config .btn-save:hover { background: #a30000; }
    .lab-config .btn-clear { background: #4d4d4d; color: #e0e0e0; }
    .lab-config .btn-clear:hover { background: #3c3f42; }

    /* ─── Quick links bar ─── */
    .quick-links {
      background: #f5f5f5; border-bottom: 1px solid #d2d2d2;
      padding: 6px 16px; font-size: 13px;
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .quick-links a {
      display: inline-block; padding: 3px 10px;
      background: #fff; border: 1px solid #d2d2d2; border-radius: 3px;
      text-decoration: none; color: #0066CC; font-size: 13px;
    }
    .quick-links a:hover { background: #CC0000; color: #fff; border-color: #CC0000; }

    /* ─── Red Hat footer ─── */
    .rh-footer {
      border-top: 3px solid #CC0000; padding: 12px;
      font-size: 13px; color: #6a6e73; text-align: center;
      font-family: var(--base-font-family);
    }
    .rh-footer a { color: #0066CC; }
  </style>
</head>
<body>

  <!-- Config bar — BEFORE docsify #app so it stays at the top -->
  <div class="lab-config" id="lab-config">
    <div class="field">
      <label>Bastion Host</label>
      <input type="text" id="bastion" placeholder="bastion.xxxxx.sandbox.opentlc.com">
    </div>
    <div class="field">
      <label>SSH Password</label>
      <input type="password" id="sshpass" placeholder="password">
    </div>
    <div class="field">
      <label>Cluster Domain</label>
      <input type="text" id="cdomain" placeholder="apps.ocp.xxxxx.sandboxNNNN.opentlc.com">
    </div>
    <div class="field">
      <label>MAAS API Key</label>
      <input type="password" id="dskey" placeholder="sk-...">
    </div>
    <button class="btn-save" onclick="saveConfig()">Save</button>
    <button class="btn-clear" onclick="clearConfig()">Clear</button>
  </div>

  <div class="quick-links" id="dynamic-links"></div>

  <div id="app">Loading&hellip;</div>

  <script>
    /* --- Populate saved values --- */
    document.getElementById('bastion').value = localStorage.getItem('BASTION_HOST') || '';
    document.getElementById('sshpass').value = localStorage.getItem('SSH_PASSWORD') || '';
    document.getElementById('cdomain').value = localStorage.getItem('CLUSTER_DOMAIN') || '';
    document.getElementById('dskey').value = localStorage.getItem('MAAS_KEY') || '';

    function populateLinks() {
      var cd = localStorage.getItem('CLUSTER_DOMAIN') || '<CLUSTER_DOMAIN>';
      var el = document.getElementById('dynamic-links');
      if (!el) return;
      el.innerHTML = '';
      [
        { name: '📺 OpenShift Console', url: 'https://console-openshift-console.' + cd },
        { name: '🔐 Vault UI', url: 'https://vault-vault.' + cd },
        { name: '🛡️ ACS (StackRox)', url: 'https://central-stackrox.' + cd },
        { name: '🔑 Keycloak', url: 'https://keycloak.' + cd + '/admin' }
      ].forEach(function(l) {
        var a = document.createElement('a');
        a.href = l.url; a.textContent = l.name; a.target = '_blank';
        el.appendChild(a);
      });
    }
    populateLinks();

    function saveConfig() {
      var b = document.getElementById('bastion').value;
      var s = document.getElementById('sshpass').value;
      var c = document.getElementById('cdomain').value.replace(/^https?:\/\//, '').replace(/[\/&?]/g, '');
      var k = document.getElementById('dskey').value;
      if (!b) { alert('Bastion Host is required.'); return; }
      if (!c) { alert('Cluster Domain is required.'); return; }
      localStorage.setItem('BASTION_HOST', b);
      localStorage.setItem('SSH_PASSWORD', s);
      localStorage.setItem('CLUSTER_DOMAIN', c);
      localStorage.setItem('MAAS_KEY', k);
      location.reload();
    }
    function clearConfig() {
      ['BASTION_HOST', 'SSH_PASSWORD', 'CLUSTER_DOMAIN', 'MAAS_KEY'].forEach(function(k) {
        localStorage.removeItem(k);
      });
      document.querySelectorAll('.lab-config input').forEach(function(i) { i.value = ''; });
      location.reload();
    }
  </script>

  <!-- Docsify config — MUST be before the single docsify script -->
  <script>
    window.$docsify = {
      auto2top: true,
      name: 'OpenShell ZT Lab',
      repo: 'https://github.com/avijra/openshell-ztm-lab',
      loadSidebar: true,
      subMaxLevel: 2,
      sidebarDisplayLevel: 1,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      copyCode: { buttonText: 'Copy', errorText: 'Error', successText: 'Copied!' },
      pagination: { crossChapter: true },
      search: { placeholder: 'Search the lab...', noData: 'No results.' },
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === 'mermaid') {
              return '<div class="mermaid">' + code + '</div>';
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      plugins: [
        function(hook) {
          hook.beforeEach(function(content) {
            var bastion = localStorage.getItem('BASTION_HOST') || '&lt;BASTION_HOST&gt;';
            var sshpass = localStorage.getItem('SSH_PASSWORD') || '&lt;SSH_PASSWORD&gt;';
            var cd = localStorage.getItem('CLUSTER_DOMAIN') || '&lt;CLUSTER_DOMAIN&gt;';
            var maaskey = localStorage.getItem('MAAS_KEY') || '&lt;MAAS_API_KEY&gt;';
            return content
              .replace(/<BASTION_HOST>/g, bastion)
              .replace(/<SSH_PASSWORD>/g, sshpass)
              .replace(/<CLUSTER_DOMAIN>/g, cd)
              .replace(/<MAAS_API_KEY>/g, maaskey);
          });
          hook.afterEach(function(html) {
            var footer = '<div class="rh-footer">'
              + 'OpenShell Zero Trust Demo Lab &mdash; '
              + '<a href="https://www.redhat.com" target="_blank">Red Hat</a>'
              + ' &times; '
              + '<a href="https://developer.nvidia.com/openshell" target="_blank">NVIDIA OpenShell</a>'
              + '</div>';
            return html + footer;
          });
        },
        function(hook) {
          hook.doneEach(function() {
            if (typeof mermaid !== 'undefined') {
              mermaid.run(undefined, document.querySelectorAll('.mermaid'));
            }
          });
        }
      ]
    };
  </script>

  <!-- Load Docsify ONCE -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Plugins — loaded AFTER docsify -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>

  <!-- Mermaid — loaded AFTER docsify -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      themeVariables: {
        primaryColor: '#CC0000',
        primaryTextColor: '#fff',
        primaryBorderColor: '#a30000',
        secondaryColor: '#f5f5f5',
        tertiaryColor: '#e0e0e0',
        lineColor: '#6a6e73',
        edgeLabelBackground: '#f0f0f0',
        fontFamily: '"Red Hat Text", sans-serif',
        fontSize: '13px'
      }
    });
  </script>
</body>
</html>
